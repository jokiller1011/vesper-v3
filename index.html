<!DOCTYPE html>
<html lang="en">
<head>

        <h2>Games</h2>
        <div id="games-list" class="games-grid"></div>
        <iframe id="game-frame" class="hidden" frameborder="0"></iframe>
      </section>

      <!-- Media Tab -->
      <section id="tab-media" class="tab hidden">
        <h2>Media</h2>
        <p class="muted-text">Movies & TV shows – powered by free public APIs.</p>
        <div id="media-results" class="media-grid"></div>
      </section>

      <!-- Browser Tab -->
      <section id="tab-browser" class="tab hidden">
        <div class="browser-controls">
          <select id="engine-select">
            <option value="sj1.1">Scramjet 1.1.0</option>
            <option value="sj2.0">Scramjet 2.0.x</option>
            <option value="sj2.0a">Scramjet 2.0.0-alpha</option>
            <option value="sj2.0.67a">Scramjet 2.0.67-alpha.2</option>
            <option value="uv3">Ultraviolet 3x</option>
            <option value="rh">Rammerhead</option>
          </select>
          <form id="browser-form" style="display:flex; flex:1; gap:10px;">
            <input type="text" id="browser-url" placeholder="Enter URL" />
            <button type="submit" class="primary-btn">Go</button>
          </form>
        </div>
        <iframe id="proxy-frame" frameborder="0"></iframe>
      </section>

      <!-- Settings Tab -->
      <section id="tab-settings" class="tab hidden">
        <h2>Settings</h2>
        <div class="settings-group">
          <h3>Account</h3>
          <button id="link-github" class="secondary-btn">Link GitHub</button>
          <button id="sign-out" class="secondary-btn">Sign Out</button>
        </div>
        <div class="settings-group">
          <h3>Prøxy</h3>
          <label>Engine <select id="setting-engine"></select></label>
          <label><input type="checkbox" id="setting-close-prevention" checked /> Close Prevention</label>
          <label><input type="checkbox" id="setting-block-prevention" checked /> Block Prevention</label>
          <label><input type="checkbox" id="setting-source-random" /> Source Randomization</label>
          <label><input type="checkbox" id="setting-url-encoding" /> URL Encoding</label>
          <label><input type="checkbox" id="setting-tor" /> Tor Routing</label>
        </div>
        <div class="settings-group">
          <h3>Cloaking</h3>
          <label>Tab Cloaking <select id="cloak-select">
            <option value="">None</option>
            <option value="google-classroom">Google Classroom</option>
            <option value="google-drive">Google Drive</option>
            <option value="ixl">IXL</option>
            <option value="canvas">Canvas</option>
          </select></label>
          <label><input type="checkbox" id="cloak-about-blank" /> About:Blank Cloaking</label>

        </div>
        <div class="settings-group">
          <h3>Customization</h3>
          <label>Theme Color <input type="color" id="theme-color" value="#3b82f6" /></label>
        </div>
