<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vesper v3</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/Vesper Logo(w only clear).svg" />
  <link rel="stylesheet" href="css/style.css" />
  
  <!-- Simple Icons CDN (Crucial for the dock icons to work) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simple-icons-font@v9/font/simple-icons.min.css" />
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="ambient-bg"></div>
  <canvas id="rain-canvas"></canvas>

  <!-- Loading overlay -->
  <div id="loading-overlay">
    <div class="loading-logo">
      <img src="assets/images/Vesper Logo(w only clear).svg" alt="V" />
      <p>loading<span class="dots">...</span></p>
    </div>
  </div>

  <!-- Auth screen -->
  <div id="auth-screen" class="hidden">
    <div class="auth-card">
      <img src="assets/images/Vesper Logo(w only).svg" alt="Vesper v3" class="auth-logo" />
      <h1>vesper <span>v3</span></h1>
      <form id="email-auth-form">
        <input type="email" id="auth-email" placeholder="Email" required />
        <input type="password" id="auth-password" placeholder="Password" required />
        <button type="submit" id="auth-submit">Sign In / Sign Up</button>
      </form>
      <button id="github-auth" class="github-btn">
        <i class="si si-github"></i> Sign in with GitHub
      </button>
      <p class="auth-error" id="auth-error"></p>
    </div>
  </div>

  <!-- Main app -->
  <div id="app" class="hidden">
    <!-- Top header -->
    <header class="top-bar">
      <div class="nav-arrows">
        <button id="nav-back" aria-label="Back">‹</button>
        <button id="nav-forward" aria-label="Forward">›</button>
        <button id="nav-refresh" aria-label="Refresh">↻</button>
      </div>
      <form class="address-bar" id="address-form">
        <svg class="lock-icon" viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 2C9.243 2 7 4.243 7 7v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7c0-2.757-2.243-5-5-5zM9 7c0-1.654 1.346-3 3-3s3 1.346 3 3v3H9V7zm3 10a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>
        <input type="text" id="url-input" placeholder="Search or enter URL" />
        <button type="button" id="bookmark-btn" aria-label="Bookmark">☆</button>
      </form>
      <div class="top-actions">
        <a href="https://discord.gg/cB88uhGqn" target="_blank" class="discord-join">
          <i class="si si-discord"></i> Join Discord
        </a>
      </div>
    </header>

    <!-- RIGHT SIDEBAR (Tabs + Navigation) -->
    <nav class="sidebar">
      <!-- Tab Bar -->
      <div class="tab-bar-container">
        <div class="tab-bar" id="tab-bar">
          <div class="browser-tab active" data-tab-id="0">
            <span>Home</span>
            <button class="close-tab" aria-label="Close tab">×</button>
          </div>
        </div>
        <button class="new-tab-btn" id="new-tab-btn" aria-label="New tab">+</button>
      </div>

      <!-- Navigation Items (Top) -->
      <div class="sidebar-nav-top">
        <button data-tab="home" class="active" title="Home">
          <i class="si si-home"></i>
          <span>Home</span>
        </button>
        <button data-tab="browser" title="Browser">
          <i class="si si-globe"></i>
          <span>Browser</span>
        </button>
      </div>

      <!-- Navigation Items (Bottom) -->
      <div class="sidebar-nav-bottom">
        <button data-tab="games" title="Games">
          <i class="si si-gamepad"></i>
          <span>Games</span>
        </button>
        <button data-tab="media" title="Media">
          <i class="si si-film"></i>
          <span>Media</span>
        </button>
        <button data-tab="settings" title="Settings">
          <i class="si si-settings"></i>
          <span>Settings</span>
        </button>
      </div>
    </nav>

    <!-- Main Content -->
    <main id="main-content">
      <!-- Home Tab -->
      <section id="tab-home" class="tab active">
        <div class="home-center">
          <img src="assets/images/Vesper Logo(Clear).svg" alt="vesper" class="home-wordmark" />
          <form class="search-wrapper" id="home-search-form">
            <input type="text" id="home-search" placeholder="Search the web…" />
          </form>
        </div>
        
        <!-- Dynamic Dock (Updated with Simple Icons) -->
        <div id="dynamic-dock">
          <button class="dock-item" onclick="window.openProxy('https://discord.com')">
            <i class="si si-discord"></i>
          </button>
          <button class="dock-item" onclick="window.openProxy('https://youtube.com')">
            <i class="si si-youtube"></i>
          </button>
          <button class="dock-item" onclick="window.openProxy('https://tiktok.com')">
            <i class="si si-tiktok"></i>
          </button>
          <button class="dock-item" onclick="window.openProxy('https://instagram.com')">
            <i class="si si-instagram"></i>
          </button>
          <button class="dock-item" onclick="window.openProxy('https://claude.ai')">
            <i class="si si-anthropic"></i>
          </button>
        </div>
      </section>

      <!-- Games Tab -->
      <section id="tab-games" class="tab hidden">
        <h2>Games</h2>
        <div id="games-list" class="games-grid"></div>
        <iframe id="game-frame" class="hidden" frameborder="0"></iframe>
      </section>

      <!-- Media Tab -->
      <section id="tab-media" class="tab hidden">
        <h2>Media</h2>
        <p class="muted-text">Movies & TV shows – powered by free public APIs.</p>
        <div id="media-results" class="media-grid"></div>
      </section>

      <!-- Browser Tab -->
      <section id="tab-browser" class="tab hidden">
        <div class="browser-controls">
          <select id="engine-select">
            <option value="sj1.1">Scramjet 1.1.0</option>
            <option value="sj2.0">Scramjet 2.0.x</option>
            <option value="sj2.0a">Scramjet 2.0.0-alpha</option>
            <option value="sj2.0.67a">Scramjet 2.0.67-alpha.2</option>
            <option value="uv3">Ultraviolet 3x</option>
            <option value="rh">Rammerhead</option>
          </select>
          <form id="browser-form" style="display:flex; flex:1; gap:10px;">
            <input type="text" id="browser-url" placeholder="Enter URL" />
            <button type="submit" class="primary-btn">Go</button>
          </form>
        </div>
        <iframe id="proxy-frame" frameborder="0"></iframe>
      </section>

      <!-- Settings Tab -->
      <section id="tab-settings" class="tab hidden">
        <h2>Settings</h2>
        <div class="settings-group">
          <h3>Account</h3>
          <button id="link-github" class="secondary-btn">Link GitHub</button>
          <button id="sign-out" class="secondary-btn">Sign Out</button>
        </div>
        <div class="settings-group">
          <h3>Prøxy</h3>
          <label>Engine <select id="setting-engine"></select></label>
          <label><input type="checkbox" id="setting-close-prevention" checked /> Close Prevention</label>
          <label><input type="checkbox" id="setting-block-prevention" checked /> Block Prevention</label>
          <label><input type="checkbox" id="setting-source-random" /> Source Randomization</label>
          <label><input type="checkbox" id="setting-url-encoding" /> URL Encoding</label>
          <label><input type="checkbox" id="setting-tor" /> Tor Routing</label>
        </div>
        <div class="settings-group">
          <h3>Cloaking</h3>
          <label>Tab Cloaking <select id="cloak-select">
            <option value="">None</option>
            <option value="google-classroom">Google Classroom</option>
            <option value="google-drive">Google Drive</option>
            <option value="ixl">IXL</option>
            <option value="canvas">Canvas</option>
          </select></label>
          <label><input type="checkbox" id="cloak-about-blank" /> About:Blank Cloaking</label>
          <label><input type="checkbox" id="cloak-click-off" /> Click‑Off Cloaking</label>
        </div>
        <div class="settings-group">
          <h3>Customization</h3>
          <label>Theme Color <input type="color" id="theme-color" value="#3b82f6" /></label>
        </div>
        <p class="credits">Credits: jokiller1011 (founder), coolgui (co‑founder), GN‑Math, Mercury Workshop.</p>
      </section>
    </main>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/loading.js"></script>
  <script src="js/rain.js"></script>
  <script src="js/proxy.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
