<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vesper v3</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/VesperLogo(w only).svg" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="loading-overlay">
    <div class="loading-logo">
      <img src="assets/images/VesperLogo(w only).svg" alt="V" />
      <p>loading…</p>
    </div>
  </div>

  <div id="auth-screen" class="hidden">
    <div class="auth-card">
      <img src="assets/images/VesperLogo(w only).svg" alt="Vesper v3" class="auth-logo" />
      <h1>vesper <span>v3</span></h1>
      <form id="email-auth-form">
        <input type="email" id="auth-email" placeholder="Email" required />
        <input type="password" id="auth-password" placeholder="Password" required />
        <button type="submit" id="auth-submit">Sign In / Sign Up</button>
      </form>
      <button id="github-auth" class="github-btn">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/github.svg" width="16" height="16" alt="" style="filter: invert(1);" /> Sign in with GitHub
      </button>
      <p class="auth-error" id="auth-error"></p>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="top-bar">
      <div class="nav-arrows">
        <button id="nav-back" aria-label="Back">‹</button>
        <button id="nav-forward" aria-label="Forward">›</button>
        <button id="nav-refresh" aria-label="Refresh">↻</button>
      </div>
      <form class="address-bar" id="address-form">
        <input type="text" id="url-input" placeholder="Search or enter URL" />
        <button type="submit" id="bookmark-btn" aria-label="Bookmark">☆</button>
      </form>
      <a href="https://discord.gg/cB88uhGqn" target="_blank" class="discord-join">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/discord.svg" width="16" height="16" alt="" style="filter: invert(1);" /> Join Discord
      </a>
    </header>

    <nav class="sidebar">
      <div class="tab-bar-container">
        <div class="tab-bar" id="tab-bar">
          <div class="browser-tab active" data-tab-id="0">
            <span>Home</span>
            <button class="close-tab" aria-label="Close tab">×</button>
          </div>
        </div>
        <button class="new-tab-btn" id="new-tab-btn" aria-label="New tab">+</button>
      </div>

      <div class="sidebar-nav">
        <button data-tab="home" class="active" title="Home">
          <img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/home.svg" width="20" height="20" alt="" style="filter: invert(1);" />
          <span>Home</span>
        </button>
        <button data-tab="browser" title="Browser">
          <img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/googlechrome.svg" width="20" height="20" alt="" style="filter: invert(1);" />
          <span>Browser</span>
        </button>
        <button data-tab="games" title="Games">
          <img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/gamepad.svg" width="20" height="20" alt="" style="filter: invert(1);" />
          <span>Games</span>
        </button>
        <button data-tab="media" title="Media">
          <img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/film.svg" width="20" height="20" alt="" style="filter: invert(1);" />
          <span>Media</span>
        </button>
        <button data-tab="settings" title="Settings">
          <img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/settings.svg" width="20" height="20" alt="" style="filter: invert(1);" />
          <span>Settings</span>
        </button>
      </div>
    </nav>

    <main id="main-content">
      <section id="tab-home" class="tab active">
        <div class="home-center">
          <img src="assets/images/VesperLogo(Clear).svg" alt="vesper" class="home-wordmark" />
          <form class="search-wrapper" id="home-search-form">
            <input type="text" id="home-search" placeholder="Search the web…" />
          </form>
        </div>
        
        <div id="dynamic-dock">
          <button class="dock-item" onclick="window.openProxy('https://discord.com')">
            <img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/discord.svg" alt="Discord" width="32" height="32" style="filter: invert(1);" />
          </button>
          <button class="dock-item" onclick="window.openProxy('https://youtube.com')">
            <img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/youtube.svg" alt="YouTube" width="32" height="32" style="filter: invert(1);" />
          </button>
          <button class="dock-item" onclick="window.openProxy('https://tiktok.com')">
            <img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/tiktok.svg" alt="TikTok" width="32" height="32" style="filter: invert(1);" />
          </button>
          <button class="dock-item" onclick="window.openProxy('https://instagram.com')">
            <img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/instagram.svg" alt="Instagram" width="32" height="32" style="filter: invert(1);" />
          </button>
          <button class="dock-item" onclick="window.openProxy('https://claude.ai')">
            <!-- Using the Anthropic logo as a reliable fallback -->
            <img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/anthropic.svg" alt="Claude" width="32" height="32" style="filter: invert(1);" />
          </button>
        </div>
      </section>

      <section id="tab-games" class="tab hidden">
        <h2>Games</h2>
        <div id="games-list" class="games-grid"></div>
        <iframe id="game-frame" class="hidden" frameborder="0"></iframe>
      </section>

      <section id="tab-media" class="tab hidden">
        <h2>Media</h2>
        <p class="muted-text">Movies & TV shows (Discovery only)</p>
        <div id="media-results" class="media-grid"></div>
      </section>

      <section id="tab-browser" class="tab hidden">
        <div class="browser-controls">
          <select id="engine-select">
            <option value="sj1.1">Scramjet 1.1.0</option>
            <option value="sj2.0">Scramjet 2.0.x</option>
            <option value="sj2.0a">Scramjet 2.0.0-alpha</option>
            <option value="sj2.0.67a">Scramjet 2.0.67-alpha.2</option>
            <option value="uv3">Ultraviolet 3x</option>
            <option value="rh">Rammerhead</option>
          </select>
          <form id="browser-form" style="display:flex; flex:1; gap:10px;">
            <input type="text" id="browser-url" placeholder="Enter URL" />
            <button type="submit" class="primary-btn">Go</button>
          </form>
        </div>
        <iframe id="proxy-frame" frameborder="0"></iframe>
      </section>

      <section id="tab-settings" class="tab hidden">
        <h2>Settings</h2>
        
        <div class="settings-group">
          <h3>Account</h3>
          <label>Username <input type="text" id="setting-username" placeholder="Change username" /></label>
          <button id="save-username" class="secondary-btn">Save</button>
          <button id="sign-out" class="secondary-btn">Sign Out</button>
        </div>

        <div class="settings-group">
          <h3>Prøxy</h3>
          <label>Engine <select id="setting-engine"></select></label>
          <label class="toggle-row">Close Prevention <input type="checkbox" id="setting-close-prevention" checked class="toggle-input" /></label>
          <label class="toggle-row">Block Prevention <input type="checkbox" id="setting-block-prevention" checked class="toggle-input" /></label>
          <label class="toggle-row">Source Randomization <input type="checkbox" id="setting-source-random" class="toggle-input" /></label>
          <label class="toggle-row">URL Encoding <input type="checkbox" id="setting-url-encoding" class="toggle-input" /></label>
          <label class="toggle-row">Tor Routing <input type="checkbox" id="setting-tor" class="toggle-input" /></label>
        </div>

        <div class="settings-group">
          <h3>Cloaking</h3>
          <label>Tab Cloaking <select id="cloak-select">
            <option value="">None</option>
            <option value="google-classroom">Google Classroom</option>
            <option value="google-drive">Google Drive</option>
            <option value="ixl">IXL</option>
            <option value="canvas">Canvas</option>
          </select></label>
          <label class="toggle-row">About:Blank Cloaking <input type="checkbox" id="cloak-about-blank" class="toggle-input" /></label>
          <label class="toggle-row">Click‑Off Cloaking <input type="checkbox" id="cloak-click-off" class="toggle-input" /></label>
        </div>

        <div class="settings-group">
          <h3>Customization</h3>
          <label>Theme Color <input type="color" id="theme-color" value="#3b82f6" /></label>
          
          <label style="display:block; margin-bottom:8px;">Background</label>
          <div class="bg-selector" id="bg-selector">
            <div class="bg-option active" data-bg="default" style="background:#0a0a0f;"></div>
            <div class="bg-option" data-bg="bg1" style="background-image: url('assets/backgrounds/1.png'); background-size: cover;"></div>
            <div class="bg-option" data-bg="bg2" style="background-image: url('assets/backgrounds/background.png'); background-size: cover;"></div>
          </div>

          <label class="toggle-row" style="margin-top:12px;">Liquid Glass <input type="checkbox" id="setting-liquid-glass" class="toggle-input" /></label>
        </div>

        <p class="credits">Credits: jokiller1011, coolgui, GN-Math, Mercury Workshop.</p>
      </section>
    </main>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/loading.js"></script>
  <script src="js/proxy.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
